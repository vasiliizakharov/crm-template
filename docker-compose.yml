name: service-crm

services:
  db:
    image: postgres:16-alpine
    container_name: service-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: crm
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [app]

  backend:
    build: ./backend
    image: service-crm-backend:1.0
    container_name: service-crm-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://crm:${PG_PASSWORD}@db:5432/crm
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_MINUTES: 10080
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-https://example.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Administrator}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8000"
    networks: [app]

  frontend:
    build: ./frontend
    image: service-crm-frontend:1.0
    container_name: service-crm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:80"
    networks: [app]

volumes:
  db_data:

networks:
  app:
    driver: bridge
